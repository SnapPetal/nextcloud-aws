# Netdata httpcheck plugin — monitors HTTP endpoints for service uptime.
# Alerts fire automatically via health_alarm_notify.conf (AWS SNS).
# https://learn.netdata.cloud/docs/data-collection/synthetic-checks/httpcheck

jobs:
  - name: nextcloud
    url: http://127.0.0.1:8080/status.php
    status_accepted: [200]

  - name: personal_website
    url: http://127.0.0.1:3003/actuator/health
    status_accepted: [200]
    response_match: '"status":"UP"'

  - name: booking
    url: http://127.0.0.1:3003/booking
    status_accepted: [200]

  - name: ente_web
    url: http://127.0.0.1:3000
    status_accepted: [200]

  - name: ente_api
    url: http://127.0.0.1:8082/ping
    status_accepted: [200]

  - name: vaultwarden
    url: http://127.0.0.1:3002/alive
    status_accepted: [200]

  - name: searxng
    url: http://127.0.0.1:8085/
    status_accepted: [200]
    response_match: SearXNG
    headers:
      User-Agent: Mozilla/5.0
      Accept: text/html,application/xhtml+xml

  - name: netdata_dashboard
    url: http://127.0.0.1:19999/
    status_accepted: [200]
