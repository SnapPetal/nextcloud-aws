name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Validate repository configuration
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          docker compose --env-file .env.example config -q
          cp .env.example .env
          ./scripts/generate-museum-yaml.sh
          test -s ente/museum.yaml
          git diff --check

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail

            # Navigate to project directory
            cd ~/nextcloud-aws || exit 1

            # Update tracked files without deleting local edits or untracked
            # secrets/configuration. Refuse deployment if tracked files changed.
            git fetch origin
            # Docker may create bind-mounted SearXNG config files as root. Restore
            # ownership before Git updates the tracked files during deployment.
            sudo chown -R "$(id -u):$(id -g)" "$PWD/searxng/core-config"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Tracked working-tree changes detected; refusing deployment."
              git status --short
              exit 1
            fi
            git checkout main
            git pull --ff-only origin main

            # Copy repo-managed Netdata configs and restart if any changed.
            if git diff ORIG_HEAD HEAD --name-only | grep -q '^netdata/'; then
              sudo rm -f /etc/netdata/netdata.conf
              sudo rm -f /etc/netdata/health_alarm_notify.conf
              sudo rm -f /etc/netdata/go.d/httpcheck.conf
              sudo rm -f /etc/netdata/health.d/file_descriptors.conf
              sudo rm -f /etc/netdata/health.d/web_log.conf
              sudo install -D -m 0644 "$PWD/netdata/netdata.conf" /etc/netdata/netdata.conf
              sudo install -D -m 0644 "$PWD/netdata/health_alarm_notify.conf" /etc/netdata/health_alarm_notify.conf
              sudo install -D -m 0644 "$PWD/netdata/go.d/httpcheck.conf" /etc/netdata/go.d/httpcheck.conf
              sudo install -D -m 0644 "$PWD/netdata/health.d/file_descriptors.conf" /etc/netdata/health.d/file_descriptors.conf
              sudo install -D -m 0644 "$PWD/netdata/health.d/web_log.conf" /etc/netdata/health.d/web_log.conf
              sudo systemctl restart netdata
            fi

            # Pull latest Docker images (only standard images, not custom-built ones)
            docker compose pull db valkey clamav ente-museum ente-web vaultwarden personal-website searxng

            # Generate museum.yaml from template + .env secrets
            ./scripts/generate-museum-yaml.sh

            # Keep every repo-managed virtual host enabled.
            for config in nginx/*; do
              target="/etc/nginx/sites-enabled/$(basename "$config")"
              if [ -e "$target" ] && [ ! -L "$target" ]; then
                echo "Refusing to replace regular nginx file: $target"
                exit 1
              fi
              sudo ln -sfn "$PWD/$config" "$target"
            done

            # Build and restart containers (--pull always ensures base images are fresh)
            docker compose build --pull app
            docker compose up -d --remove-orphans --wait --wait-timeout 180

            # Point Nextcloud at the shared Valkey service (database 0).
            ./scripts/configure-nextcloud-valkey.sh

            # Reload nginx to pick up any config changes (test first so a bad
            # config never takes down all virtual hosts)
            sudo nginx -t && sudo systemctl reload nginx

            # Clean up old images
            docker image prune -f

            # Show running containers
            docker compose ps

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Wait for containers to be healthy
            sleep 10

            # Check that every declared service has a running container.
            expected=$(docker compose -f ~/nextcloud-aws/docker-compose.yml config --services | wc -l)
            running=$(docker compose -f ~/nextcloud-aws/docker-compose.yml ps --status running -q | sort -u | wc -l)
            if [ "$running" -ne "$expected" ]; then
              echo "Expected $expected running containers, found $running"
              docker compose -f ~/nextcloud-aws/docker-compose.yml ps -a
              exit 1
            fi
            echo "All $running declared services are running successfully!"
