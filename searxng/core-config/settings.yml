use_default_settings: true

general:
  debug: false
  instance_name: "Private Search"

search:
  safe_search: 2
  autocomplete: "duckduckgo"
  formats:
    - html

server:
  # The container replaces this with SEARXNG_SECRET at startup.
  secret_key: "change-me"
  limiter: true
  image_proxy: true
  public_instance: false

  # Defense-in-depth headers recommended by the SearXNG settings reference.
  # These are emitted by SearXNG before the response reaches the host nginx.
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  # The container replaces this with SEARXNG_VALKEY_URL at startup.
  url: valkey://valkey:6379/1
